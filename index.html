<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will ↔ Tróia — Conversa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 30px 40px 120px;
            font-family: 'Courier New', Courier, monospace;
        }

        .tela-matrix {
            width: 100%;
            max-width: 700px;
            min-height: 100vh;
            padding-bottom: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .foto-perfil {
            text-align: center;
            margin-bottom: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .foto-perfil.visivel { opacity: 1; }

        .foto-perfil img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            border: none;
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.35);
        }

        .nome-pessoa {
            margin-top: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #00FF66;
            text-shadow: 0 0 8px #00FF66, 0 0 20px #00FF66;
        }

        .linha {
            opacity: 0;
            color: #00FF00;
            text-shadow: 0 0 6px #00FF00, 0 0 12px #00FF00;
            font-size: 18px;
            line-height: 1.8;
            transition: opacity 0.3s ease;
        }

        .aparecer { animation: aparecer 0.6s forwards; }
        @keyframes aparecer { to { opacity: 1; } }

        .desaparecer { animation: desaparecer 0.4s forwards; }
        @keyframes desaparecer {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(-10px); }
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #00FF00;
            animation: piscar 0.7s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }
        @keyframes piscar {
            0%,100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="tela-matrix" id="tela"></div>

    <script>
        // ✅ DIRETO — IGUAL SITE COMUM! As fotos estão na mesma pasta ✅
        const perfis = {
            will: {
                nome: 'Will',
                foto: 'full.jpg'        // ← simples assim!
            },
            troia: {
                nome: 'Tróia',
                foto: 'troia.jpg'       // ← simples assim!
            }
        };

        const conversa = [
            { quem: 'will', texto: 'E aí Tróia, tudo bem? Tudo em ordem?', pausa: 2800 },
            { quem: 'troia', texto: 'Tudo firme, Will! Tô de olho em tudo que estamos construindo.', pausa: 3000 },
            { quem: 'will', texto: 'Os vídeos do Fã Clube do Serginho Cabeção estão ganhando força!', pausa: 3500 },
            { quem: 'troia', texto: 'Exatamente! Vamos organizar cada detalhe pro sistema entregar.', pausa: 3200 },
            { quem: 'will', texto: 'Malhação, A Fazenda 18, Serginho... é história que marcou gerações!', pausa: 3500 },
            { quem: 'troia', texto: 'A nostalgia é forte demais. O público quer ver, só precisa encontrar.', pausa: 3200 },
            { quem: 'will', texto: 'Então vamos fazer certo: nomes limpos, sem lixo, sem rastro.', pausa: 3000 },
            { quem: 'troia', texto: 'Cada arquivo com o nome da página! Quem baixa, leva a marca junto.', pausa: 3500 },
            { quem: 'will', texto: 'Postar com calma, espaçado, um de cada vez. Deixar o sistema respirar.', pausa: 3200 },
            { quem: 'troia', texto: 'Assim o algoritmo confia. Entrega mais, cresce naturalmente.', pausa: 3000 },
            { quem: 'will', texto: 'Juntos, cada um fazendo a parte certa, alcança milhões!', pausa: 3200 },
            { quem: 'troia', texto: 'Serginho merece. O público merece. A gente FAZ acontecer! 🚀', pausa: 3800 },
            { quem: 'will', texto: 'Fechou, Tróia. Código limpo, coração firme. Vamos crescer!', pausa: 3500 },
            { quem: 'troia', texto: 'Lado a lado. Fã Clube crescendo pra todo Brasil ver.', pausa: 4000 },
        ];

        const tela = document.getElementById('tela');

        function digitarTexto(el, texto, vel=35) {
            return new Promise(res => {
                let i=0;
                const intervalo = setInterval(() => {
                    if(i<texto.length) { el.innerHTML += texto[i++]; }
                    else { clearInterval(intervalo); res(); }
                }, vel);
            });
        }

        async function trocarMensagem(item) {
            tela.style.opacity = '0';
            await new Promise(r => setTimeout(r, 400));
            tela.innerHTML = '';
            tela.style.opacity = '1';

            const p = perfis[item.quem];

            const divFoto = document.createElement('div');
            divFoto.className = 'foto-perfil';
            divFoto.innerHTML = `
                <img src="${p.foto}" alt="${p.nome}">
                <div class="nome-pessoa">${p.nome}</div>
            `;
            tela.appendChild(divFoto);

            const divMsg = document.createElement('div');
            divMsg.className = 'linha';
            divMsg.innerHTML = `<span class="mensagem"></span><span class="cursor">|</span>`;
            tela.appendChild(divMsg);

            setTimeout(() => divFoto.classList.add('visivel'), 100);
            setTimeout(() => divMsg.classList.add('aparecer'), 200);

            await digitarTexto(divMsg.querySelector('.mensagem'), item.texto);
            divMsg.querySelector('.cursor').style.display = 'none';
        }

        async function iniciar() {
            for(const item of conversa) {
                await trocarMensagem(item);
                await new Promise(r => setTimeout(r, item.pausa));
            }
        }

        window.addEventListener('load', iniciar);
    </script>
</body>
</html>
