<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversa Devs — Fã Clube Serginho Cabeção</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 60px 120px;
            font-family: 'Courier New', Courier, monospace;
        }

        .tela-matrix {
            width: 100%;
            max-width: 700px;
            min-height: 100vh;
            padding-top: 0;
            padding-bottom: 40vh; /* ← Para sempre nos 40% de baixo = nunca desce até o fim */
            color: #00FF00;
            text-shadow: 0 0 6px #00FF00, 0 0 12px #00FF00;
            font-size: 18px;
            line-height: 1.8;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* ← Sempre alinha de baixo pra cima */
        }

        .linha {
            opacity: 0;
            white-space: pre-wrap;
            transition: opacity 0.3s ease;
        }

        .aparecer {
            animation: aparecer 0.6s forwards;
        }

        @keyframes aparecer {
            to { opacity: 1; }
        }

        .desaparecer {
            animation: desaparecer 0.4s forwards;
        }

        @keyframes desaparecer {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(-10px); }
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: #00FF00;
            animation: piscar 0.7s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes piscar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .nome {
            font-weight: bold;
            color: #88FF88;
        }

        .mensagem {
            color: #00FF00;
        }
    </style>
</head>
<body>
    <div class="tela-matrix" id="tela">
        <!-- Apenas uma mensagem por vez aqui -->
    </div>

    <script>
        const conversa = [
            { nome: 'dev_01', texto: 'E aí, parceiro? Tudo firme?', pausa: 2500 },
            { nome: 'dev_02', texto: 'Tudo certo! Estou de olho nos vídeos do Fã Clube...', pausa: 2800 },
            { nome: 'dev_01', texto: 'O conteúdo está lindo, mas precisa chegar pra MUITO mais gente.', pausa: 3000 },
            { nome: 'dev_02', texto: 'Exato! Não pode ficar escondido. Temos que fazer o sistema entregar.', pausa: 3000 },
            { nome: 'dev_01', texto: 'Malhação, A Fazenda 18, Serginho Cabeção... é história que marca.', pausa: 3000 },
            { nome: 'dev_02', texto: 'A nostalgia é forte demais. O público quer ver, só precisa encontrar.', pausa: 3000 },
            { nome: 'dev_01', texto: 'Então vamos organizar: nomes limpos, sem lixo, sem rastro.', pausa: 2800 },
            { nome: 'dev_02', texto: 'Cada arquivo com o nome da página! Quem baixa, leva a marca junto.', pausa: 3000 },
            { nome: 'dev_01', texto: 'Postar com calma, espaçado, um de cada vez. Deixar o sistema respirar.', pausa: 3000 },
            { nome: 'dev_02', texto: 'Assim o algoritmo confia. Entrega mais, cresce naturalmente.', pausa: 2800 },
            { nome: 'dev_01', texto: 'Juntos, cada um fazendo a parte certa, alcança milhões.', pausa: 3000 },
            { nome: 'dev_02', texto: 'Serginho merece. O público merece. A gente FAZ acontecer! 🚀', pausa: 3500 },
            { nome: 'dev_01', texto: 'Fechou. Código limpo, coração firme. Vamos crescer!', pausa: 3000 },
            { nome: 'dev_02', texto: 'Lado a lado. Fã Clube crescendo pra todo Brasil ver.', pausa: 4000 },
        ];

        const tela = document.getElementById('tela');
        let mensagemAtual = null;

        function digitarTexto(elemento, texto, velocidade = 35) {
            return new Promise(resolver => {
                let i = 0;
                const intervalo = setInterval(() => {
                    if (i < texto.length) {
                        elemento.innerHTML += texto[i];
                        i++;
                    } else {
                        clearInterval(intervalo);
                        resolver();
                    }
                }, velocidade);
            });
        }

        async function trocarMensagem(novaMensagemFn) {
            // Se tem mensagem anterior → faz sumir
            if (mensagemAtual) {
                mensagemAtual.classList.add('desaparecer');
                await new Promise(r => setTimeout(r, 400));
                tela.innerHTML = '';
            }

            // Mostra a nova mensagem
            mensagemAtual = await novaMensagemFn();
        }

        async function mostrarLinha(item) {
            const div = document.createElement('div');
            div.className = 'linha';
            div.innerHTML = `<span class="nome">${item.nome}:</span> <span class="mensagem"></span><span class="cursor">|</span>`;
            tela.appendChild(div);
            
            setTimeout(() => div.classList.add('aparecer'), 50);
            
            const spanTexto = div.querySelector('.mensagem');
            await digitarTexto(spanTexto, item.texto);
            
            div.querySelector('.cursor').style.display = 'none';
            return div;
        }

        async function iniciarConversa() {
            for (const item of conversa) {
                await trocarMensagem(() => mostrarLinha(item));
                await new Promise(r => setTimeout(r, item.pausa));
            }
        }

        window.addEventListener('load', iniciarConversa);
    </script>
</body>
</html>
