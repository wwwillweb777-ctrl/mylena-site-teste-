<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will ↔ Tróia — Conversa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 30px 40px 120px;
        }

        .tela-matrix {
            width: 100%;
            max-width: 700px;
            min-height: 100vh;
            padding-bottom: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .foto-perfil {
            text-align: center;
            margin-bottom: 12px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .foto-perfil.visivel { opacity: 1; }

        .foto-perfil img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            border: none;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .linha-nome {
            text-align: center;
            margin-bottom: 10px;
            opacity: 0;
            transition: opacity 0.5s ease 0.1s;
        }

        .linha-nome.visivel { opacity: 1; }

        .etiqueta-nome {
            font-family: 'Roboto Mono', monospace;
            font-size: 16px;
            color: #ff3333;
            text-shadow: 0 0 6px #ff3333, 0 0 12px #ff0000;
        }

        .valor-nome {
            font-family: 'Fira Code', monospace;
            font-size: 16px;
            font-weight: 300;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(255,255,255,0.6);
            margin-left: 4px;
        }

        .linha {
            opacity: 0;
            color: #00FF00;
            text-shadow: 0 0 6px #00FF00, 0 0 12px #00FF00;
            font-family: 'Courier New', monospace;
            font-size: 17px;
            line-height: 1.8;
            transition: opacity 0.3s ease;
            margin-bottom: 15px;
        }

        .aparecer { animation: aparecer 0.6s forwards; }
        @keyframes aparecer { to { opacity: 1; } }

        .foto-assunto {
            text-align: center;
            margin: 10px 0 20px 0;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .foto-assunto.visivel { opacity: 1; }

        .foto-assunto img {
            max-width: 260px;
            width: 75%;
            height: auto;
            border-radius: 10px;
            border: none;
            box-shadow: 0 0 18px rgba(0, 255, 0, 0.3);
        }

        .cursor {
            display: inline-block;
            width: 9px;
            height: 19px;
            background: #00FF00;
            animation: piscar 0.7s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }
        @keyframes piscar {
            0%,100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="tela-matrix" id="tela"></div>

    <script>
        const perfis = {
            will: { nome: 'Will', foto: 'full.jpg' },
            troia: { nome: 'Tróia', foto: 'troia.jpg' }
        };

        // ✅ NOME DO ARQUIVO CONFIRMADO NO PRINT: serginho.png
        const fotosAssunto = {
            serginho: 'https://cdn.jsdelivr.net/gh/wwwillweb777/mylena-site-teste-@main/serginho.png'
        };

        const conversa = [
            { quem: 'will', texto: 'E aí Tróia, tudo bem? Tudo em ordem no Fã Clube?', pausa: 2800 },
            { quem: 'troia', texto: 'Tudo firme, Will! Estamos de olho em tudo, inclusive no que estão fazendo contra nós.', pausa: 3000 },
            { quem: 'will', texto: 'Percebi que tem gente espionando o Fã Clube. Precisamos tomar cuidado.', pausa: 3200 },
            { quem: 'troia', texto: 'Exato! Mas o foco principal é o Serginho. Ele merece todo nosso apoio!', pausa: 3500, mostrarFoto: 'serginho' },
            { quem: 'will', texto: 'Isso mesmo! Malhação, A Fazenda 18... o Serginho Cabeção marcou gerações!', pausa: 3500, mostrarFoto: 'serginho' },
            { quem: 'troia', texto: 'A nostalgia é forte demais. O público quer ver ele brilhar de novo!', pausa: 3500, mostrarFoto: 'serginho' },
            { quem: 'will', texto: 'Então vamos fazer certo: nomes limpos, sem lixo, sem deixar rastro.', pausa: 3000 },
            { quem: 'troia', texto: 'Cada arquivo com o nome da página! Quem baixa, leva a marca junto.', pausa: 3500 },
            { quem: 'will', texto: 'Vamos fortalecer a campanha pro Serginho ser reconhecido!', pausa: 3500, mostrarFoto: 'serginho' },
            { quem: 'troia', texto: 'Isso! A gente FAZ acontecer! O Serginho merece! 🚀', pausa: 3800, mostrarFoto: 'serginho' },
            { quem: 'will', texto: 'Fechou, Tróia. Código limpo, coração firme. Vamos crescer!', pausa: 3500 },
            { quem: 'troia', texto: 'Lado a lado. Fã Clube crescendo pra todo Brasil ver!', pausa: 4000 },
        ];

        const tela = document.getElementById('tela');

        function digitarTexto(el, texto, vel=35) {
            return new Promise(res => {
                let i = 0;
                const intervalo = setInterval(() => {
                    if (i < texto.length) { el.innerHTML += texto[i++]; }
                    else { clearInterval(intervalo); res(); }
                }, vel);
            });
        }

        async function trocarMensagem(item) {
            tela.style.opacity = '0';
            await new Promise(r => setTimeout(r, 400));
            tela.innerHTML = '';
            tela.style.opacity = '1';

            const p = perfis[item.quem];

            const divFoto = document.createElement('div');
            divFoto.className = 'foto-perfil';
            divFoto.innerHTML = `<img src="${p.foto}" alt="${p.nome}">`;
            tela.appendChild(divFoto);

            const divNome = document.createElement('div');
            divNome.className = 'linha-nome';
            divNome.innerHTML = `
                <span class="etiqueta-nome">Nome:</span>
                <span class="valor-nome">${p.nome}</span>
            `;
            tela.appendChild(divNome);

            const divMsg = document.createElement('div');
            divMsg.className = 'linha';
            divMsg.innerHTML = `<span class="mensagem"></span><span class="cursor">|</span>`;
            tela.appendChild(divMsg);

            // ✅ FOTO DEPOIS DA MENSAGEM — só quando mencionar
            if (item.mostrarFoto && fotosAssunto[item.mostrarFoto]) {
                const divFotoAssunto = document.createElement('div');
                divFotoAssunto.className = 'foto-assunto';
                divFotoAssunto.innerHTML = `<img src="${fotosAssunto[item.mostrarFoto]}" alt="Serginho">`;
                tela.appendChild(divFotoAssunto);
                setTimeout(() => divFotoAssunto.classList.add('visivel'), 350);
            }

            setTimeout(() => divFoto.classList.add('visivel'), 80);
            setTimeout(() => divNome.classList.add('visivel'), 150);
            setTimeout(() => divMsg.classList.add('aparecer'), 250);

            await digitarTexto(divMsg.querySelector('.mensagem'), item.texto);
            divMsg.querySelector('.cursor').style.display = 'none';
        }

        async function iniciar() {
            for (const item of conversa) {
                await trocarMensagem(item);
                await new Promise(r => setTimeout(r, item.pausa));
            }
        }

        window.addEventListener('load', iniciar);
    </script>
</body>
</html>
