<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will ↔ Tróia — Conversa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 30px 40px 120px;
        }

        .tela-matrix {
            width: 100%;
            max-width: 700px;
            min-height: 100vh;
            padding-bottom: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .foto-perfil {
            text-align: center;
            margin-bottom: 15px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .foto-perfil.visivel { opacity: 1; }

        .foto-perfil img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            border: none;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .imagem-serginho {
            text-align: center;
            margin: 15px 0;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .imagem-serginho.visivel { opacity: 1; }

        .imagem-serginho img {
            max-width: 280px;
            width: 80%;
            height: auto;
            border-radius: 8px;
            border: none;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.25);
        }

        .linha-nome {
            text-align: center;
            margin-bottom: 12px;
            opacity: 0;
            transition: opacity 0.5s ease 0.1s;
        }

        .linha-nome.visivel { opacity: 1; }

        .etiqueta-nome {
            font-family: 'Roboto Mono', monospace;
            font-size: 16px;
            color: #ff3333;
            text-shadow: 0 0 6px #ff3333, 0 0 12px #ff0000;
        }

        .valor-nome {
            font-family: 'Fira Code', monospace;
            font-size: 16px;
            font-weight: 300;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(255,255,255,0.6);
            margin-left: 4px;
        }

        .linha {
            opacity: 0;
            color: #00FF00;
            text-shadow: 0 0 6px #00FF00, 0 0 12px #00FF00;
            font-family: 'Courier New', monospace;
            font-size: 17px;
            line-height: 1.8;
            transition: opacity 0.3s ease;
        }

        .aparecer { animation: aparecer 0.6s forwards; }
        @keyframes aparecer { to { opacity: 1; } }

        .desaparecer { animation: desaparecer 0.4s forwards; }
        @keyframes desaparecer {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(-8px); }
        }

        .cursor {
            display: inline-block;
            width: 9px;
            height: 19px;
            background: #00FF00;
            animation: piscar 0.7s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }
        @keyframes piscar {
            0%,100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="tela-matrix" id="tela"></div>

    <script>
        const perfis = {
            will: {
                nome: 'Will',
                foto: 'full.jpg'
            },
            troia: {
                nome: 'Tróia',
                foto: 'troia.jpg'
            }
        };

        // ✅ Arquivo solto na raiz → caminho direto!
        const imagemSerginho = 'https://cdn.jsdelivr.net/gh/wwwillweb777/mylena-site-teste-@main/FaClubeSerginho_AFazenda18_Votar.png';

        const conversa = [
            { quem: 'will', texto: 'E aí Tróia, tudo bem? Tudo em ordem?', pausa: 2800 },
            { quem: 'troia', texto: 'Tudo firme, Will! Tô de olho em tudo que estamos construindo.', pausa: 3000 },
            { quem: 'will', texto: 'Os vídeos do Fã Clube estão ganhando força! Precisamos alcançar mais gente.', pausa: 3500 },
            { quem: 'troia', texto: 'Exatamente! O foco é o Serginho Cabeção. Ele merece todo o reconhecimento!', pausa: 3500, mostrarSerginho: true },
            { quem: 'will', texto: 'Isso mesmo! Malhação, A Fazenda 18... ele marcou gerações inteiras.', pausa: 3500 },
            { quem: 'troia', texto: 'A nostalgia é forte demais. O público quer ver o Serginho brilhar!', pausa: 3500, mostrarSerginho: true },
            { quem: 'will', texto: 'Então vamos fazer certo: nomes limpos, sem lixo, sem rastro.', pausa: 3000 },
            { quem: 'troia', texto: 'Cada arquivo com o nome da página! Quem baixa, leva a marca junto.', pausa: 3500 },
            { quem: 'will', texto: 'Vamos juntos fortalecer a campanha pro Serginho ser campeão!', pausa: 3500, mostrarSerginho: true },
            { quem: 'troia', texto: 'Isso! A gente FAZ acontecer! O Serginho merece! 🚀', pausa: 3800 },
            { quem: 'will', texto: 'Fechou, Tróia. Código limpo, coração firme. Vamos crescer!', pausa: 3500 },
            { quem: 'troia', texto: 'Lado a lado. Fã Clube crescendo pra todo Brasil ver!', pausa: 4000 },
        ];

        const tela = document.getElementById('tela');

        function digitarTexto(el, texto, vel=35) {
            return new Promise(res => {
                let i = 0;
                const intervalo = setInterval(() => {
                    if (i < texto.length) { el.innerHTML += texto[i++]; }
                    else { clearInterval(intervalo); res(); }
                }, vel);
            });
        }

        async function trocarMensagem(item) {
            tela.style.opacity = '0';
            await new Promise(r => setTimeout(r, 400));
            tela.innerHTML = '';
            tela.style.opacity = '1';

            const p = perfis[item.quem];

            const divFoto = document.createElement('div');
            divFoto.className = 'foto-perfil';
            divFoto.innerHTML = `<img src="${p.foto}" alt="${p.nome}">`;
            tela.appendChild(divFoto);

            const divNome = document.createElement('div');
            divNome.className = 'linha-nome';
            divNome.innerHTML = `
                <span class="etiqueta-nome">Nome:</span>
                <span class="valor-nome">${p.nome}</span>
            `;
            tela.appendChild(divNome);

            // ✅ Só aparece a imagem quando tem "mostrarSerginho: true"
            if (item.mostrarSerginho) {
                const divImg = document.createElement('div');
                divImg.className = 'imagem-serginho';
                divImg.innerHTML = `<img src="${imagemSerginho}" alt="Serginho Cabeção">`;
                tela.appendChild(divImg);
                setTimeout(() => divImg.classList.add('visivel'), 200);
            }

            const divMsg = document.createElement('div');
            divMsg.className = 'linha';
            divMsg.innerHTML = `<span class="mensagem"></span><span class="cursor">|</span>`;
            tela.appendChild(divMsg);

            setTimeout(() => divFoto.classList.add('visivel'), 80);
            setTimeout(() => divNome.classList.add('visivel'), 150);
            setTimeout(() => divMsg.classList.add('aparecer'), 250);

            await digitarTexto(divMsg.querySelector('.mensagem'), item.texto);
            divMsg.querySelector('.cursor').style.display = 'none';
        }

        async function iniciar() {
            for (const item of conversa) {
                await trocarMensagem(item);
                await new Promise(r => setTimeout(r, item.pausa));
            }
        }

        window.addEventListener('load', iniciar);
    </script>
</body>
</html>
