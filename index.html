<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversa Devs — Fã Clube Serginho Cabeção</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            min-height: 100vh;
            padding: 30px 20px;
            line-height: 1.8;
        }

        .tela-matrix {
            color: #00FF00;
            text-shadow: 0 0 8px #00FF00, 0 0 15px #00FF00;
            font-size: 18px;
            max-width: 900px;
            margin: 0 auto;
        }

        .linha {
            opacity: 0;
            margin-bottom: 12px;
            white-space: pre-wrap;
        }

        .aparecer {
            animation: aparecer 0.8s forwards;
        }

        @keyframes aparecer {
            to { opacity: 1; }
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: #00FF00;
            animation: piscar 0.7s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes piscar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .nome {
            font-weight: bold;
            color: #88FF88;
        }

        .mensagem {
            color: #00FF00;
        }
    </style>
</head>
<body>
    <div class="tela-matrix" id="tela">
        <!-- As linhas vão sendo inseridas aqui pelo JS -->
    </div>

    <script>
        // A conversa exatamente como você pediu: entre devs, sobre o Fã Clube
        const conversa = [
            { nome: 'dev_01', texto: 'E aí, parceiro? Tudo em cima?', pausa: 1200 },
            { nome: 'dev_02', texto: 'Tudo firme! Olha, estou vendo os vídeos do Fã Clube do Serginho Cabeção...', pausa: 1500 },
            { nome: 'dev_01', texto: 'Isso mesmo! O conteúdo está lindo, mas precisa chegar pra MUITO mais gente.', pausa: 1400 },
            { nome: 'dev_02', texto: 'Exatamente! Não pode ficar só com a gente. Temos que fazer o sistema entregar cada vídeo.', pausa: 1600 },
            { nome: 'dev_01', texto: 'Concordo! Cada post é sobre alguém que marcou uma geração. Malhação, A Fazenda 18, Serginho...', pausa: 1500 },
            { nome: 'dev_02', texto: 'Isso! A nostalgia é forte demais. O público quer ver, só precisa ENCONTRAR.', pausa: 1400 },
            { nome: 'dev_01', texto: 'Então é isso: vamos organizar tudo. Nomes limpos, arquivos corretos, legendas certas, hashtags no lugar.', pausa: 1700 },
            { nome: 'dev_02', texto: 'Certo! Sem lixo no nome, sem rastro de baixador. Cada arquivo com o nome da página = marca que viaja.', pausa: 1600 },
            { nome: 'dev_01', texto: 'Exato! Quem baixa, leva o nome junto. Quem compartilha, divulga sem perceber.', pausa: 1500 },
            { nome: 'dev_02', texto: 'Postar com calma, espaçado, um de cada vez. Deixar o sistema respirar.', pausa: 1400 },
            { nome: 'dev_01', texto: 'Assim o algoritmo confia. Entrega mais, cresce naturalmente.', pausa: 1300 },
            { nome: 'dev_02', texto: 'Juntos, cada um fazendo a parte certa, alcança milhões.', pausa: 1500 },
            { nome: 'dev_01', texto: 'Serginho merece. O público merece. A gente faz acontecer.', pausa: 1400 },
            { nome: 'dev_02', texto: 'Fechou. Código limpo, coração firme. Vamos crescer! 🚀', pausa: 2000 },
            { nome: 'dev_01', texto: 'Juntos, lado a lado. Fã Clube crescendo pra todo Brasil ver.', pausa: 1800 },
        ];

        const tela = document.getElementById('tela');
        let indice = 0;

        function digitarTexto(elemento, texto, velocidade = 35) {
            return new Promise(resolver => {
                let i = 0;
                const intervalo = setInterval(() => {
                    if (i < texto.length) {
                        elemento.innerHTML += texto[i];
                        i++;
                    } else {
                        clearInterval(intervalo);
                        resolver();
                    }
                }, velocidade);
            });
        }

        async function mostrarLinha(item) {
            const div = document.createElement('div');
            div.className = 'linha';
            div.innerHTML = `<span class="nome">${item.nome}:</span> <span class="mensagem"></span><span class="cursor">|</span>`;
            tela.appendChild(div);
            
            // Faz aparecer primeiro a linha
            setTimeout(() => div.classList.add('aparecer'), 50);
            
            const spanTexto = div.querySelector('.mensagem');
            await digitarTexto(spanTexto, item.texto);
            
            // Remove o cursor quando terminar
            div.querySelector('.cursor').style.display = 'none';
            
            // Rola a tela pra última linha
            window.scrollTo(0, document.body.scrollHeight);
        }

        async function iniciarConversa() {
            for (const item of conversa) {
                await mostrarLinha(item);
                await new Promise(r => setTimeout(r, item.pausa));
            }
        }

        // Inicia quando a página carregar
        window.addEventListener('load', iniciarConversa);
    </script>
</body>
</html>
