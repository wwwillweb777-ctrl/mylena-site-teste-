<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — Gabriel do Corte ✂️💈</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #0f0f0f 0%, #1a1a1a 100%);
            font-family: 'Segoe UI', sans-serif;
            padding: 1rem;
        }
        .caixa-chat {
            max-width: 450px; margin: 0 auto; background: #000;
            border-radius: 24px; border: 3px solid #d4af37; display: flex; flex-direction: column;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
        }
        .cabecalho {
            background: linear-gradient(90deg, #d4af37, #b8860b); color: #000; padding: 1.2rem; text-align: center;
            border-top-left-radius: 20px; border-top-right-radius: 20px;
        }
        .meu-id { font-size: 0.7rem; opacity: 0.7; margin-top: 0.4rem; background: rgba(255,255,255,.1); padding: 0.25rem 0.8rem; border-radius: 50px; display: inline-block; color: #999; }
        .area-mensagens { height: 400px; overflow-y: auto; padding: 1rem; background: #111; }
        .mensagem { margin-bottom: 1rem; max-width: 85%; }
        .mensagem-eu { margin-left: auto; }
        .mensagem-eu .bolha { background: linear-gradient(90deg, #d4af37, #b8860b); color: #000; border-radius: 18px 18px 4px 18px; padding: 0.8rem 1rem; }
        .mensagem-resposta { margin-right: auto; }
        .mensagem-resposta .bolha { background: #222; color: #d4af37; border-radius: 18px 18px 18px 4px; padding: 0.8rem 1rem; border: 1px solid #d4af37; }
        .nome-remetente { font-weight: bold; font-size: 0.85rem; margin-bottom: 0.2rem; }
        .data { font-size: 0.7rem; opacity: 0.7; margin-top: 0.3rem; }
        .aviso-vazio { text-align: center; color: #d4af37; padding: 2rem; }
        .form-etapa { padding: 1.2rem; border-top: 2px solid #333; }
        .escondido { display: none !important; }
        input, textarea { width: 100%; padding: 0.9rem; border: 2px solid #d4af37; border-radius: 12px; font-size: 1rem; margin-bottom: 0.8rem; outline: none; background: #1a1a1a; color: #fff; }
        input:focus, textarea:focus { border-color: #f4d03f; }
        button { width: 100%; padding: 0.9rem; border: none; border-radius: 50px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: all 0.3s ease; }
        button:active { transform: scale(0.98); }
        .btn-principal { background: linear-gradient(90deg, #d4af37, #b8860b); color: #000; }
        .btn-principal:disabled { opacity: 0.7; cursor: not-allowed; }
        .boas-vindas { background: #1a1a1a; padding: 1rem; border-radius: 12px; margin-bottom: 1rem; text-align: center; color: #d4af37; border: 1px solid #333; }
        .voltar { text-align: center; margin-top: 1rem; }
        .voltar a { color: #d4af37; text-decoration: none; font-size: 0.9rem; }
        .sucesso-msg { color: #25D366; text-align: center; padding: 0.5rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="caixa-chat">
        <div class="cabecalho">
            <h1>💬 Conversar com Gabriel</h1>
            <p>Gabriel do Corte ✂️💈</p>
            <div class="meu-id">🆔 <span id="exibirMeuId">—</span></div>
        </div>
        <div id="areaMensagens" class="area-mensagens">
            <p class="aviso-vazio">Olá! 😊<br>Digite seu nome abaixo para começar ↓</p>
        </div>
        <div id="passoNome" class="form-etapa">
            <input type="text" id="nomeChat" placeholder="Digite seu nome ✂️">
            <button class="btn-principal" onclick="salvarNome()">Continuar →</button>
        </div>
        <div id="passoMensagem" class="form-etapa escondido">
            <div class="boas-vindas" id="mensagemBoasVindas"></div>
            <textarea id="campoMensagem" rows="3" placeholder="Escreva sua mensagem... 💈"></textarea>
            <button id="btnEnviar" class="btn-principal" onclick="enviarMensagem()">📤 Enviar Mensagem</button>
            <p id="confirmacaoEnvio" class="sucesso-msg escondido">✅ Mensagem enviada! Respondo em breve 💈✨</p>
        </div>
    </div>
    <div class="voltar"><a href="index.html">← Voltar para a página principal</a></div>

    <script>
        // ==========================================
        // ⚙️ CONFIGURAÇÕES — JÁ PRONTAS ✅
        // ==========================================
        const SEU_NUMERO_WHATSAPP = "553190721928";
        const LINK_SITE = "https://wwwillweb777-ctrl.github.io/mylena-site-teste-/";
        const NOME_ADMIN = "Gabriel do Corte ✂️💈";
        const CAMINHO_MSG = "gabriel_do_corte/mensagens";
        const CAMINHO_ACESSOS = "gabriel_do_corte/acessos";
        const CHAVE_ID = "idVisitante_gabriel";
        const CHAVE_NOME = "nomeVisitante_gabriel";

        // ==========================================
        // 🔥 FIREBASE — CHAVE DE TESTE ✅
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBwYqhA74ThUkYpHkwxc2EM-kJ26I2-ek8",
            authDomain: "chave-key-teste.firebaseapp.com",
            databaseURL: "https://chave-key-teste-default-rtdb.firebaseio.com",
            projectId: "chave-key-teste",
            storageBucket: "chave-key-teste.firebasestorage.app",
            messagingSenderId: "58692158626",
            appId: "1:58692158626:web:2762d42ea0abf6726943fb"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function gerarIdUnico() {
            const p1 = Math.random().toString(36).slice(2,6);
            const p2 = Math.random().toString(36).slice(2,6);
            return `usr_${p1}${p2}`;
        }

        let ID_VISITANTE = localStorage.getItem(CHAVE_ID);
        if (!ID_VISITANTE) {
            ID_VISITANTE = gerarIdUnico();
            localStorage.setItem(CHAVE_ID, ID_VISITANTE);
        }
        document.getElementById('exibirMeuId').textContent = ID_VISITANTE;

        let nomeUsuario = localStorage.getItem(CHAVE_NOME) || "";

        function dataAtual() {
            return new Date().toLocaleString('pt-BR');
        }

        window.onload = async function() {
            const snap = await db.ref(`${CAMINHO_ACESSOS}/${ID_VISITANTE}/nome`).once("value");
            const nomeBanco = snap.val();
            
            if (nomeBanco && nomeBanco.trim() !== "") {
                nomeUsuario = nomeBanco;
                localStorage.setItem(CHAVE_NOME, nomeUsuario);
                entrarNoChat();
            } 
            else if (nomeUsuario && nomeUsuario.trim() !== "") {
                await db.ref(`${CAMINHO_ACESSOS}/${ID_VISITANTE}/nome`).set(nomeUsuario);
                entrarNoChat();
            }
        };

        async function salvarNome() {
            const nome = document.getElementById('nomeChat').value.trim();
            if (!nome) { alert("⚠️ Digite seu nome!"); return; }
            
            nomeUsuario = nome;
            localStorage.setItem(CHAVE_NOME, nomeUsuario);
            await db.ref(`${CAMINHO_ACESSOS}/${ID_VISITANTE}/nome`).set(nomeUsuario);
            entrarNoChat();
        }

        function entrarNoChat() {
            document.getElementById('passoNome').classList.add('escondido');
            document.getElementById('passoMensagem').classList.remove('escondido');
            document.getElementById('mensagemBoasVindas').innerHTML = 
                `👋 Bem-vindo, <strong>${nomeUsuario}</strong>!<br>É um prazer receber você! 💈✨`;
            carregarMensagens();
        }

        async function enviarMensagem() {
            const texto = document.getElementById('campoMensagem').value.trim();
            if (!texto) { alert("⚠️ Escreva sua mensagem!"); return; }

            const btn = document.getElementById('btnEnviar');
            btn.disabled = true;
            btn.textContent = "Enviando...";

            // Salva no banco
            await db.ref(CAMINHO_MSG).push({
                idRemetente: ID_VISITANTE,
                nomeRemetente: nomeUsuario || "Visitante",
                texto: texto,
                data: dataAtual(),
                resposta: null,
                dataResposta: null
            });

            // ✅ MENSAGEM QUE CHEGA NO SEU WHATSAPP — DISCRETA, CLARA E COMPLETA
            const mensagemWhatsApp = `🔔 NOVA MENSAGEM — Gabriel do Corte

👤 Cliente: ${nomeUsuario}
💬 Mensagem: ${texto}
🕐 Enviado em: ${dataAtual()}

🔗 Acessar conversa: ${LINK_SITE}

———
Gabriel do Corte ✂️💈`;

            // Abre WhatsApp em JANELA SEPARADA — o cliente NÃO vê nada estranho
            const link = `https://wa.me/${SEU_NUMERO_WHATSAPP}?text=${encodeURIComponent(mensagemWhatsApp)}`;
            window.open(link, '_blank', 'width=1,height=1,left=-9999,top=-9999');

            // ✅ O cliente só vê isso — limpo e elegante
            document.getElementById('campoMensagem').value = '';
            document.getElementById('confirmacaoEnvio').classList.remove('escondido');
            
            setTimeout(() => {
                document.getElementById('confirmacaoEnvio').classList.add('escondido');
            }, 4000);

            btn.disabled = false;
            btn.textContent = "📤 Enviar Mensagem";
        }

        function carregarMensagens() {
            const area = document.getElementById('areaMensagens');
            db.ref(CAMINHO_MSG).orderByChild("idRemetente").equalTo(ID_VISITANTE).on("value", snap => {
                area.innerHTML = '';
                if (!snap.exists()) {
                    area.innerHTML = '<p class="aviso-vazio">Ainda não tem mensagens 💬</p>';
                    return;
                }
                snap.forEach(item => {
                    const m = item.val();
                    area.innerHTML += `
                        <div class="mensagem mensagem-eu">
                            <div class="bolha">
                                <p class="nome-remetente">${m.nomeRemetente}</p>
                                <p>${m.texto}</p>
                                <p class="data">${m.data}</p>
                            </div>
                        </div>
                    `;
                    if (m.resposta) area.innerHTML += `
                        <div class="mensagem mensagem-resposta">
                            <div class="bolha">
                                <p class="nome-remetente">✂️ ${NOME_ADMIN}</p>
                                <p>${m.resposta}</p>
                                <p class="data">${m.dataResposta || ''}</p>
                            </div>
                        </div>
                    `;
                });
                area.scrollTop = area.scrollHeight;
            });
        }
    </script>
</body>
</html>
