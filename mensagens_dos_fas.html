<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens dos Fãs 💛</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            font-family: 'Segoe UI', sans-serif;
            overflow: auto;
        }
        .tela-completa {
            width: 100%;
            min-height: 100%;
            border: 4px solid #ffd700;
            padding: 0.8rem 1rem 1rem;
            display: flex;
            flex-direction: column;
            background: #000;
        }
        .cabecalho {
            text-align: center;
            padding: 0.3rem 0 0.8rem;
            flex-shrink: 0;
        }
        .titulo-com-icone {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 0.4rem;
        }
        .icone {
            font-size: 2rem;
            line-height: 1;
        }
        h1 {
            color: #ffd700;
            font-size: 1.4rem;
        }
        .descricao {
            color: #ddd;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        
        /* 🎬 ÁREA DO VÍDEO */
        .container-video {
            max-width: 640px;
            margin: 0 auto 1.2rem;
            padding: 1rem;
            background: #1a1a1a;
            border-radius: 12px;
            border: 2px solid #ffd700;
            flex-shrink: 0;
        }
        .titulo-video {
            color: #ffd700;
            text-align: center;
            font-size: 1rem;
            margin-bottom: 0.8rem;
        }
        video {
            width: 100%;
            border-radius: 8px;
            background: #000;
        }
        .botoes-volume {
            margin-top: 0.8rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            align-items: center;
        }
        .botoes-volume button {
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-menos {
            background: #e74c3c;
            color: white;
        }
        .btn-mais {
            background: #27ae60;
            color: white;
        }
        .nivel-volume {
            color: white;
            font-size: 0.9rem;
            min-width: 50px;
            text-align: center;
        }
        
        .area-mensagens {
            flex: 1;
            background: #111;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 1rem;
            overflow-y: auto;
            margin-bottom: 0.8rem;
            min-height: 300px;
        }
        .area-mensagens h3 {
            color: #ffd700;
            font-size: 1rem;
            margin-bottom: 0.8rem;
            text-align: center;
        }
        .mensagem-item {
            background: #222;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 0.7rem;
            color: #eee;
            font-size: 0.9rem;
            line-height: 1.4;
            border-left: 3px solid #ffd700;
        }
        .mensagem-item .quem {
            font-size: 0.8rem;
            color: #ffd700;
            margin-bottom: 0.4rem;
        }
        .mensagem-texto {
            margin-bottom: 0.5rem;
        }
        .resposta-publica {
            background: #1a2e1a;
            border-left: 3px solid #39ff14;
            padding: 0.7rem;
            margin-top: 0.7rem;
            border-radius: 6px;
        }
        .resposta-titulo {
            color: #39ff14;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 0.3rem;
        }
        .resposta-texto {
            color: #90ee90;
            font-size: 0.9rem;
        }
        .sem-mensagens {
            color: #666;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 0.95rem;
        }
        button.voltar {
            width: 100%;
            background: transparent;
            border: 3px solid #ffd700;
            color: #ffd700;
            padding: 0.8rem;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        button.voltar:active {
            background: rgba(255, 215, 0, 0.1);
        }
        .area-mensagens::-webkit-scrollbar {
            width: 6px;
        }
        .area-mensagens::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="tela-completa">
        <div class="cabecalho">
            <div class="titulo-com-icone">
                <span class="icone">📢</span>
                <h1>Mensagens dos Fãs</h1>
            </div>
            <p class="descricao">Veja todas as mensagens de apoio enviadas aqui 💛</p>
        </div>

        <!-- 🎬 VÍDEO FIXADO NO TOPO -->
        <div class="container-video">
            <h3 class="titulo-video">🎥 Conheça o Serginho!</h3>
            <video id="meuVideo" controls>
                <source src="videos/will_programador.mp4" type="video/mp4">
                Seu navegador não suporta reproduzir vídeos.
            </video>
            <div class="botoes-volume">
                <button class="btn-menos" onclick="diminuirVolume()">🔉 −</button>
                <span class="nivel-volume" id="nivelVolume">50%</span>
                <button class="btn-mais" onclick="aumentarVolume()">🔊 +</button>
            </div>
        </div>

        <div class="area-mensagens">
            <h3>💬 Mensagens Recebidas</h3>
            <div id="listaMensagens">
                <p class="sem-mensagens">Carregando mensagens...</p>
            </div>
        </div>

        <button class="voltar" onclick="voltarPagina()">⬅️ Voltar para Enviar Mensagem</button>
    </div>

    <script>
        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // 🎵 Controles de Volume do Vídeo
        const video = document.getElementById('meuVideo');
        video.volume = 0.5; // Volume inicial 50%

        function aumentarVolume() {
            if (video.volume < 1) {
                video.volume = Math.min(1, video.volume + 0.1);
                atualizarMostradorVolume();
            }
        }

        function diminuirVolume() {
            if (video.volume > 0) {
                video.volume = Math.max(0, video.volume - 0.1);
                atualizarMostradorVolume();
            }
        }

        function atualizarMostradorVolume() {
            document.getElementById('nivelVolume').textContent = Math.round(video.volume * 100) + '%';
        }

        function voltarPagina() {
            window.history.back();
        }

        function carregarMensagens() {
            const lista = document.getElementById('listaMensagens');
            db.ref("MensagensApoio").limitToLast(50).on("value", (snapshot) => {
                lista.innerHTML = '';
                const dados = snapshot.val();
                
                if (!dados) {
                    lista.innerHTML = '<p class="sem-mensagens">Ainda não há mensagens. Seja o primeiro a apoiar! 💪</p>';
                    return;
                }

                const itens = Object.entries(dados).reverse();
                itens.forEach(([chave, mensagem]) => {
                    const div = document.createElement('div');
                    div.className = 'mensagem-item';
                    
                    let respostaHTML = '';
                    if (mensagem.resposta) {
                        respostaHTML = `
                            <div class="resposta-publica">
                                <div class="resposta-titulo">🌟 Resposta oficial:</div>
                                <div class="resposta-texto">${mensagem.resposta}
                                    <div style="font-size:0.75rem; color:#7ccd7c; margin-top:0.3rem;">🕒 ${mensagem.dataResposta || ''}</div>
                                </div>
                            </div>
                        `;
                    }

                    div.innerHTML = `
                        <div class="quem">
                            👤 ${mensagem.nome || 'Anônimo'} — 🌐 ${mensagem.rede || 'Não informado'} — ${mensagem.arroba || ''}
                            <br><span style="font-size:0.7rem; color:#777;">🕒 ${mensagem.horario || ''}</span>
                        </div>
                        <div class="mensagem-texto">${mensagem.texto}</div>
                        ${respostaHTML}
                    `;
                    lista.appendChild(div);
                });
            });
        }

        window.onload = carregarMensagens;
    </script>
</body>
</html>
